[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "20"
  # GITHUB_REPOSITORY's value is just this repo's own public "owner/repo"
  # name (used by the CMS's git-write mechanism) -- not a real secret, but
  # Netlify's build-time secrets scanner fails the build on ANY appearance
  # of a configured env var's literal value anywhere in scanned content,
  # including ordinary doc prose (e.g. a GitHub PR URL). Omit it from the
  # scan rather than relying on nobody ever typing the repo's own name.
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_REPOSITORY"

[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# W13 T13.8 (12-plan §4): the site's first CSP — REPORT-ONLY until T13.11's
# clean soak promotes the header name to Content-Security-Policy. This value
# is the ALL-PROVIDERS-DISABLED baseline: script-src keeps 'unsafe-inline'
# (the inline consent bootstrap + astro-compress reality); style/font cover
# the Google Fonts chrome; frame-src covers the T10.5 media mint's embed
# hosts (youtube-nocookie/vimeo); img-src stays wide (article/content images
# are externally hosted by design) — the pinning value lives in script-src,
# connect-src, and frame-src. Enabling any ad provider REQUIRES adding its
# adapter's cspHosts here in the SAME change: the hosts-drift test
# (tests/netlify/csp-drift.test.ts) fails otherwise, in both directions.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the /mcp function warm and log a latency probe every 5 minutes so
# agents don't pay a cold start (and time out) on first connect. Scheduled
# functions run only on the published production deploy.
[functions."mcp-keepalive"]
  schedule = "*/5 * * * *"

# W18 T18.4: daily membership housekeeping — expire stale invitations, purge
# removed memberships past their grace period, report queued identity deletes.
# A scheduled function only runs if its schedule is DECLARED here (P1: every
# site carries this block; the parity audit checks it).
[functions."membership-sweep"]
  schedule = "17 3 * * *"

# W19 T19.3: the editorial-request sweep — derives every running request's
# status from CMS-Agent's run state, appends progress to the attached chats,
# and nudges a genuinely dead driver at most three times. This is what makes
# "close the window and come back" true; without it a request never leaves
# `queued`. A scheduled function only runs if its schedule is DECLARED here
# (P1: every site carries this block; the parity audit checks it).
[functions."editorial-request-sweep"]
  schedule = "*/5 * * * *"


[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/get-public-pdf?blobKey=pdf/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/get-public-image?blobKey=image/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# W14 F10 — the site's own OAuth 2.1 authorization server, beside the MCP
# resource server it protects. One function serves every endpoint; each rule
# names its endpoint explicitly rather than relying on a splat, so the routing
# is readable here instead of inferred there. The two well-known splats exist
# because MCP clients probe both the bare metadata path and the
# resource-path-suffixed form.

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=protected-resource-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=protected-resource-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=authorization-server-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=authorization-server-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=register"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=authorize"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/consent"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=consent"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=token"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/revoke"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=revoke"
  status = 200
  force = true

# W13 (12-plan §5.3): first-party tracking ingest — same-origin, generic
# path (ad-blocker posture). GET ?mode=region doubles as the consent gate's
# region oracle.
[[redirects]]
  from = "/api/t"
  to = "/.netlify/functions/track-ingest"
  status = 200
  force = true

# T9.9 / W15 S1: serve the object workspace for /admin/content/<id> — ONE
# path segment (`:objectId`), never the splat. The splat form also matched
# /admin/content/ itself and swallowed the static content library index in
# production (the "Back to library" dead-end loop). status 200 without force,
# so the static library index and the __workspace placeholder page are never
# shadowed; only single-segment object ids with no static file rewrite to the
# workspace, which reads the id client-side.
[[redirects]]
  from = "/admin/content/:objectId"
  to = "/admin/content/__workspace"
  status = 200

# W19 T19.4: serve the request detail for /admin/requests/<id> — ONE path
# segment (`:requestId`), never the splat, exactly as the object workspace
# above. status 200 without force, so the static list index and the __request
# placeholder page are never shadowed; the island reads the id client-side.
[[redirects]]
  from = "/admin/requests/:requestId"
  to = "/admin/requests/__request"
  status = 200


