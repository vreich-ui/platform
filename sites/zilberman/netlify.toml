# Per-site Netlify config. The redirects here MUST equal this client's
# site.config.ts `redirects` (the drift-guard discipline root netlify.toml and
# the fleet's root-deployed site's site.config.ts already share).
#
# W14 T14.3: this file describes a REAL build. Set the Netlify project's BASE
# DIRECTORY to sites/zilberman — that is what makes Netlify read this
# file instead of the repo-root one. Every path below is then relative to that
# base, and the build command runs with sites/zilberman as its working
# directory (the shell's astro config, tailwind config, and config.yaml lookups
# are all absolute for exactly this reason).

# The build command self-heals the workspace install. Netlify runs this with
# the BASE DIRECTORY as cwd, and on a site's FIRST build (no warm cache) it does
# not necessarily install the monorepo ROOT — so `astro` is absent from
# node_modules, plain `npx astro` silently DOWNLOADS the latest astro from the
# registry, and that version rejects NODE_VERSION 20 ("not supported by Astro").
# That is exactly how fernwell's first build failed (W14 T14.9). So: resolve the
# workspace astro or install the root, then run astro with --no-install, which
# makes a missing binary a loud error instead of a silent wrong-version fetch.
# The check short-circuits on warm builds, so this costs nothing once cached.
#
# T16.2: the build also runs scripts/validate-upload-images.mjs, the same
# gate root's `npm run build` always ran — a corrupt/mismatched committed
# upload image or a dangling markdown image reference fails the BUILD, not
# just a later render. This site's own tree lays out uploads under
# assets/images and legacy markdown posts under data/post (not the
# root deploy's src/-prefixed legacy layout), so both roots are passed explicitly,
# site-relative (Netlify runs this command with sites/zilberman as cwd).
[build]
  publish = "dist"
  command = "(cmp -s ../../package-lock.json ../../node_modules/.lock-stamp 2>/dev/null || (npm ci --prefix ../.. --no-audit --no-fund && cp ../../package-lock.json ../../node_modules/.lock-stamp)) && node ../../scripts/validate-upload-images.mjs assets/images data/post && node ../../scripts/tracking-experiments-build.mjs --export-root data/site --public-dir public --edge-dir netlify/edge-functions --config-yaml config.yaml && npx --no-install astro build --config astro.config.ts && (node ../../scripts/tracking-dims-push.mjs --export-root data/site || true)"
  # Netlify skips a build when nothing under the base directory (sites/zilberman) changed.
  # Our MCP functions bundle the shared packages/core workspace, which lives OUTSIDE this
  # base dir — so a packages/core-only change was being skipped and shipped stale functions
  # (PR #501, 2026-08-04). This ignore command builds when EITHER sites/zilberman OR
  # packages/core changed. exit 0 = skip, non-zero = build; `git diff --quiet` is 0 when
  # unchanged. An empty $CACHED_COMMIT_REF (first/forced build) makes git error non-zero =>
  # build, which is the safe default.
  # G7 — root `scripts` and root `package.json`/`package-lock.json` added too: the build command
  # above runs ../../scripts/*.mjs directly and `npm ci --prefix ../..` off the root lockfile, so a
  # root-only change to either was being skipped here exactly like the packages/core gap PR #501
  # fixed for the shared workspace.
  # PRODUCTION IS PROMOTED, NOT PUSHED (cloud-cost N1).
  #
  # Every merge to main used to fan out into one charged production build on each
  # of the five fleet projects — packages/core is in every site's ignore list, so
  # a single shared-code commit built all of them — for ~1,005 production deploys
  # a period against a budget that expects a fraction of that. Almost none of
  # those deploys were wanted at the moment they ran: content publishes commit
  # with [skip netlify] and go live through release_to_production's build hook,
  # and code lands in batches that are promoted deliberately.
  #
  # So: exit 0 (skip) for anything building the production branch, and fall
  # through to the path-scoped diff below for everything else, which keeps deploy
  # previews and branch deploys behaving exactly as they did.
  #
  # WHAT STILL DEPLOYS. Netlify does not run the ignore command at all for a
  # build triggered by a BUILD HOOK, "regardless of exit code"
  # (docs.netlify.com/build/configure-builds/ignore-builds). That is the whole
  # design: release_to_production and admin-release already fire
  # NETLIFY_BUILD_HOOK_URL, so the content path is untouched, and
  # `node scripts/fleet-promote.mjs` fires the same kind of hook per site to ship
  # code. Both signals are tested because CONTEXT is not documented as available
  # to the ignore command while BRANCH is; either one matching is enough.
  ignore = 'if [ "$CONTEXT" = "production" ] || [ "$BRANCH" = "main" ]; then exit 0; fi; git -C ../.. diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- sites/zilberman packages/core scripts package.json package-lock.json'
[build.environment]
  NODE_VERSION = "20"
  # Same omission the root netlify.toml carries (W15 S3 parity): the secrets
  # scanner fails the ENTIRE build on any appearance of GITHUB_REPOSITORY's
  # literal value (the monorepo's own owner/name string) anywhere in scanned
  # files -- and repo docs legitimately name the repo. See the root file's
  # comment for the full story.
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_REPOSITORY"

# T16.2 (genesis-parity-plan §1.2 item 4): the core build/security posture
# root netlify.toml has always carried — pretty_urls off, the /_astro/*
# immutable-cache header, and the CSP-Report-Only header — copied verbatim
# (the admin-parity `toml-posture` check enforces byte equality against
# packages/core/cli/admin-parity.mjs's CANONICAL_TOML_POSTURE).
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# W13 T13.8 (12-plan §4): the site's first CSP — REPORT-ONLY until T13.11's
# clean soak promotes the header name to Content-Security-Policy. This value
# is the ALL-PROVIDERS-DISABLED baseline: script-src keeps 'unsafe-inline'
# (the inline consent bootstrap + astro-compress reality); style/font cover
# the Google Fonts chrome; frame-src covers the T10.5 media mint's embed
# hosts AND 'self' (an article's attached PDF renders as a same-origin
# <iframe> — article-object/render-nodes.ts's documentMediaHtml; it was an
# <object> until 2026-09-07 and object-src 'none' would have killed it the
# moment this header stopped being Report-Only); img-src stays wide (article/content images
# are externally hosted by design) — the pinning value lives in script-src,
# connect-src, and frame-src. Enabling any ad provider REQUIRES adding its
# adapter's cspHosts here in the SAME change: the hosts-drift test
# (tests/netlify/csp-drift.test.ts) fails otherwise, in both directions.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# T21.5 — variant serving at the edge. Declared on EVERY tenant with
# `path = "/*"` because the function's own first act is to check whether this
# site has any active experiment at all: with `experiments: []` the generated
# map is `{}` and every request returns `context.next()` before a cookie, a geo
# lookup, or an RNG call happens. Declaring it everywhere (rather than only on
# a tenant currently running a test) is what makes turning an experiment on a
# CONTENT change — publish `trk_<site>` and rebuild — instead of an infra one.
#
# It must stay the ONLY `/*` edge function: two of them on the same path is an
# ordering question nobody should have to reason about per request.
[[edge_functions]]
  path = "/*"
  function = "variant-serve"

# Every site DEPLOYS `mcp-keepalive`, but a scheduled function only ever runs
# if its schedule is DECLARED here. Shipping the function without this block is
# what leaves a site's /mcp cold: after ~5-15 idle minutes the instance is
# reclaimed and the next agent pays a cold start (bundle load + native sharp
# binding) slow enough to blow an MCP client's initialize timeout — the
# "cannot connect" symptom the function exists to prevent. Scheduled functions
# run only on the published production deploy; MCP_KEEPALIVE_DISABLED=true
# turns probing off without a code change.
[functions."mcp-keepalive"]
  schedule = "*/5 * * * *"

# W18 T18.4: daily membership housekeeping — expire stale invitations, purge
# removed memberships past their grace period, report queued identity deletes.
# A scheduled function only runs if its schedule is DECLARED here (P1: every
# site carries this block; the parity audit checks it).
[functions."membership-sweep"]
  schedule = "17 3 * * *"

# W4 (Wolf 2026-09-13): daily media compaction — soft-delete artifact references
# nothing cites (bytes kept, restore still works), then collapse byte-duplicates
# onto one blob per sha. References younger than 24 h are never swept (capture
# writes artifacts before the pages that cite them). Runs after membership-sweep
# and before any 04:00 job. A scheduled function only runs if its schedule is
# DECLARED here (every site carries this block; the parity audit checks it).
[functions."media-compaction-sweep"]
  schedule = "41 3 * * *"

# W19 T19.3: the editorial-request sweep — derives every running request's
# status from CMS-Agent's run state, appends progress to the attached chats,
# and nudges a genuinely dead driver at most three times. This is what makes
# "close the window and come back" true; without it a request never leaves
# `queued`. A scheduled function only runs if its schedule is DECLARED here
# (P1: every site carries this block; the parity audit checks it).
[functions."editorial-request-sweep"]
  schedule = "*/5 * * * *"

# M0.2: nightly rebuild of the trusted object-inventory index. A warm
# `object_inventory` read is now TWO blob reads and no listing, which is only
# safe while every record write goes through `objects/record-writer.ts`. This
# runs the same verified sweep an untrusted read takes, so a store that drifted
# by any route this repo cannot police is repaired within a day. 04:23 is clear
# of the 03:17 membership pass and the 03:41 media compaction pass. A scheduled
# function only runs if its schedule is DECLARED here (P1: every site carries
# this block; the parity audit checks it).
[functions."object-index-rebuild"]
  schedule = "23 * * * *"

# M1: the release snapshot — snapshots/release.json, refreshed every two
# minutes. admin-release-state and admin-editorial-view read deploy facts from
# that one blob instead of calling the Netlify deploys API twice and GitHub
# /compare once per publish commit on every page view. The write-path hooks
# (object_publish, release_to_production) cover what people DO; only a schedule
# sees what happens TO a deploy — a build finishing, a rollback, Auto
# Publishing unlocking. A scheduled function only runs if its schedule is
# DECLARED here (P1: every site carries this block; the parity audit checks it).
[functions."release-snapshot-refresh"]
  schedule = "*/2 * * * *"

# M3.4: the CMS-Agent health probe, on a clock instead of on a page load. It
# used to run live on admin-governance's `get` verb — 2768 ms of a 3.9 s
# /admin/visual-identity load — behind a per-instance memo that a cold
# container starts empty. This stores the last result in
# snapshots/governance.json; a page reads the blob and never probes. Minute
# offset 4 keeps it clear of the two `*/5` passes and of minute 23.
[functions."governance-probe-refresh"]
  schedule = "4-59/5 * * * *"

# M4: the hourly warm for snapshots/analytics/<source>/<range>.json. The page
# serves those blobs and refreshes them in the background, but a frozen
# function container never finishes a promise it did not await — so this is the
# guarantee, and the background refresh is only an optimisation. Without this
# block the tenant's analytics blobs only ever move when somebody opens the
# page and waits for the eleven-call Netlify Analytics fan-out.
[functions."analytics-snapshot-warm"]
  schedule = "47 * * * *"

[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/get-public-pdf?blobKey=pdf/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/get-public-image?blobKey=image/:splat"
  status = 200
  force = true

# /api/artifacts/upload: packages/core/server/functions/artifact-upload.ts declares
# `export const config = { path: '/api/artifacts/upload' }`, but every site file only reaches
# it through `export * from '<core>'` -- a re-exported `config` is not statically resolvable, so
# Netlify never registers the path on any deployed tenant (verified fleet-wide 404 on
# 2026-09-17, while /.netlify/functions/artifact-upload itself answered 401/415, proving the
# function IS deployed). Redirect it by hand, same as /img/* and /pdf/* above.
[[redirects]]
  from = "/api/artifacts/upload"
  to = "/.netlify/functions/artifact-upload"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# W3.1 — the ChatGPT Actions facade over this tenant's MCP tools. One splat: the
# tool name is the last path segment and the function routes on it, so adding a
# tool to the plugin charter never needs a routing change here. The facade
# forwards to the same handler and the same OAuth as /mcp; it holds no
# credential and adds no business logic of its own.
[[redirects]]
  from = "/api/plugin/*"
  to = "/.netlify/functions/plugin-actions"
  status = 200
  force = true

# W7.1 — the public install page's data endpoint. Deliberately NOT under
# /api/plugin/*: that prefix is the Actions facade, whose path list IS the
# charter, so /api/plugin/install would arrive there and be refused 403 as a
# tool out of charter. The facts it serves are public; the bundle downloads
# behind ?download= are gated on tenant membership (editor and above).
[[redirects]]
  from = "/api/plugin-install"
  to = "/.netlify/functions/plugin-install"
  status = 200
  force = true

# W14 F10 — the site's own OAuth 2.1 authorization server, beside the MCP
# resource server it protects. One function serves every endpoint; each rule
# names its endpoint explicitly rather than relying on a splat, so the routing
# is readable here instead of inferred there. The two well-known splats exist
# because MCP clients probe both the bare metadata path and the
# resource-path-suffixed form.

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=protected-resource-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=protected-resource-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=authorization-server-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=authorization-server-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=register"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=authorize"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/consent"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=consent"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=token"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/revoke"
  to = "/.netlify/functions/mcp-oauth?oauth_endpoint=revoke"
  status = 200
  force = true

[[redirects]]
  from = "/api/t"
  to = "/.netlify/functions/track-ingest"
  status = 200
  force = true

# W15 S1: one path segment (`:objectId`), unforced — the splat + force pair
# shadowed the static content library index at /admin/content (root
# netlify.toml's comment has the full story).
[[redirects]]
  from = "/admin/content/:objectId"
  to = "/admin/content/__workspace"
  status = 200

# W19 T19.4: serve the request detail for /admin/requests/<id> — ONE path
# segment (`:requestId`), never the splat, exactly as the object workspace
# above. status 200 without force, so the static list index and the __request
# placeholder page are never shadowed; the island reads the id client-side.
[[redirects]]
  from = "/admin/requests/:requestId"
  to = "/admin/requests/__request"
  status = 200

# R11.4 (T21.30): the object analytics drill-down — same one-path-segment,
# unforced pattern as the two ids above (the placeholder page is never
# shadowed; the island reads the id client-side).
[[redirects]]
  from = "/admin/analytics/object/:objectId"
  to = "/admin/analytics/object/__object"
  status = 200

# T2.1 (admin latency): /admin has no surface of its own — it is the shell's
# entry, and the workspace it opens on is Requests. This is an EXACT-path rule,
# so it matches /admin (and /admin/) ONLY: Netlify prefix-matches a `from` just
# when it carries a splat or a :placeholder, which is why /admin/content's own
# 301 below can coexist with the /admin/content/:objectId rewrite above and why
# this one cannot swallow /admin/requests, /admin/objects, or any other
# /admin/* page. force=true for the same reason as its neighbours: routes/admin/
# index.astro is a REAL built page (it carries a <meta http-equiv="refresh"> as
# the belt-and-braces fallback for any context that never sees this rule) and
# would otherwise be served instead of redirecting.
[[redirects]]
  from = "/admin"
  to = "/admin/requests"
  status = 302
  force = true

# T2.1 D1(a): the objects plane is now canonical -- Templates/Media/Content
# collapse into one library at /admin/objects. force=true because each of
# these still has a real built page.
[[redirects]]
  from = "/admin/content"
  to = "/admin/objects"
  status = 301
  force = true

[[redirects]]
  from = "/admin/templates"
  to = "/admin/objects?type=template,section_template"
  status = 301
  force = true

[[redirects]]
  from = "/admin/studio"
  to = "/admin/objects?type=template,section_template"
  status = 301
  force = true

# No governed object type is "media" -- the closest honest destination is
# the objects plane's grid view, not a fabricated type facet.
[[redirects]]
  from = "/admin/media"
  to = "/admin/objects?view=grid"
  status = 301
  force = true

# T6: Maintenance (owner-only raw blob browser) is retired in favor of
# Inventory (owner+admin search across objects/artifacts/system stores).
[[redirects]]
  from = "/admin/maintenance"
  to = "/admin/inventory"
  status = 301
  force = true

# T21.9b: the traffic dashboard is renamed to Analytics (it now carries
# engagement, conversions, producers, and experiments -- not just visits).
[[redirects]]
  from = "/admin/traffic"
  to = "/admin/analytics"
  status = 301
  force = true

# The admin shell's own 404 (2026-09-13). LAST of the /admin rules and
# deliberately UNFORCED: Netlify serves a matching static file before an
# unforced rule, and every real admin page is either a built file or one of
# the rewrites above, so this fires only where nothing else matched. Without
# it an unmatched /admin/* path (a mistyped /admin/visual-identity, say) fell
# through to the PUBLIC site's 404 — no sidebar, no way back, and a "Sign in"
# header shown to a live Owner session.
[[redirects]]
  from = "/admin/*"
  to = "/admin/not-found"
  status = 404

