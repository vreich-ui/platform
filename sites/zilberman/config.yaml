site:
  name: Zilberman
  site: 'https://zilberman.netlify.app'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Zilberman
    template: '%s — Zilberman'
  description: 'Zilberman — a starter site, ready for real content.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Zilberman
    images:
      - url: '/Social/og-default.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'learn/library'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

ui:
  theme: 'system'
