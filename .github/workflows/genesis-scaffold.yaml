# G2 — the scaffold half of tenant birth, so genesis needs no human.
#
# ## Why this is CI and not cms-agent
#
# cms-agent mints a tenant end to end — Netlify site, deploy binding, bearer custody, env defaults,
# registry record — and then stops, because the tenant's CODE has to exist in THIS repo and its
# Cloud Run image has no checkout of it. `sites/<slug>/` is produced by `create-site.mjs` running
# against a real working tree, and a new site is a new npm workspace, so the root lockfile has to be
# regenerated by a real `npm install`. Neither is reproducible from an API call. CI is the only
# place that already has the repo, Node and npm.
#
# ## What makes this job different from every other workflow here
#
# It commits to `main`, driven by a dispatch from another system. capture-preview — the workflow
# this one's dispatch machinery is modelled on — states plainly that it "never commits, never
# publishes, never releases, never deploys", and a script asserts it. This one must commit, so the
# equivalent discipline is a charter that is narrow and MECHANICALLY enforced:
# scripts/ci/genesis-scaffold-guard.mjs runs after the scaffold and before the commit and refuses
# anything that is not the birth of exactly one new tenant. A dispatch cannot reach another path.
#
# ## Scaffold only — this job never provisions
#
# `create-site.mjs` provisions Netlify when it is given a token, and it reads NETLIFY_API_TOKEN from
# the environment as well as from --netlify-token. cms-agent owns provisioning (it did it before
# dispatching), so the token is explicitly emptied below rather than merely not passed: a fleet
# secret arriving on the runner for some future reason must not silently turn this into a second
# provisioner racing the first.
#
# ## Why the tenant's genesis artifacts travel as a git blob
#
# `--editorial-strategy`, `--editorial-voice`, `--visual-standard`, `--logo` and `--tracking-config`
# each take a partial JSON body, and the fleet genesis policy can REQUIRE some of them. Together
# they exceed the ~64 KB dispatch-payload ceiling, so cms-agent writes one document as an
# unreferenced git blob (no commit, no branch — a transport) and passes its sha, exactly as
# capture-preview does. The refusal when a required one is missing is create-site's own
# machine-readable 422 (`genesis_artifact_required`), carried back verbatim.

name: genesis-scaffold

# GitHub does not return a workflow run's inputs over the API, so the dispatcher finds the run it
# started by matching the run NAME. Same correlation contract as capture-preview.
run-name: genesis-scaffold ${{ inputs.slug }} ${{ inputs.cms_run_id }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: The new tenant's slug, e.g. acme-labs. Must be a legal object-id slug.
        required: true
        type: string
      brand_name:
        description: Display brand name. Defaults to a title-cased slug.
        required: false
        type: string
      canonical_host:
        description: The tenant's canonical host, when one is already decided.
        required: false
        type: string
      niche:
        description: One line describing what the tenant publishes about.
        required: false
        type: string
      artifacts_blob:
        description: Git blob sha of a genesis-scaffold-artifacts.v1 document holding the partial bodies.
        required: false
        type: string
      cms_run_id:
        description: cms-agent's correlation id, carried in the run name so the dispatcher can find this run.
        required: false
        type: string

permissions:
  # `write` is for the scaffold commit and for the result blob. The charter guard is what keeps that
  # write to one new tenant's tree plus the two generated artifacts a new tenant changes.
  contents: write

concurrency:
  # PER SLUG, deliberately. A repo-wide group holds only ONE pending run: a third dispatch CANCELS
  # the queued second, and a cancelled run is indistinguishable from a refusal to anything reading
  # conclusions — that tenant's mint would wait forever on a job that never started. Two tenants
  # scaffolding at once do contend on refs/heads/main, and the rebase-and-retry in the commit step is
  # what handles that; losing a mint is the worse failure.
  group: genesis-scaffold-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every dispatch input reaches the shell as an ENVIRONMENT VARIABLE, never interpolated into a
      # `run:` block — `${{ inputs.x }}` is substituted before bash parses the line, which is a
      # command injection waiting for the first slug containing a quote.
      GENESIS_SLUG: ${{ inputs.slug }}
      GENESIS_BRAND_NAME: ${{ inputs.brand_name }}
      GENESIS_CANONICAL_HOST: ${{ inputs.canonical_host }}
      GENESIS_NICHE: ${{ inputs.niche }}
      GENESIS_ARTIFACTS_BLOB: ${{ inputs.artifacts_blob }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # See the header: emptied, not omitted.
      NETLIFY_API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit is pushed to main, so the checkout needs write credentials and real history.
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BEFORE anything is written. create-site is idempotent and would simply report an existing
      # tree as untouched, which the guard would then read as "the scaffold produced nothing" — a
      # true refusal, but a confusing one. Fail here with the reason a human can act on.
      - name: Refuse a slug that already exists
        run: |
          if [ -z "$GENESIS_SLUG" ]; then
            echo "No slug was supplied. (workflow_dispatch's required: true is enforced by the web form, not by the API.)" >&2
            exit 1
          fi
          if [ -e "sites/$GENESIS_SLUG" ]; then
            echo "sites/$GENESIS_SLUG already exists. Genesis mints new tenants; it never re-scaffolds a live one." >&2
            exit 1
          fi

      - name: Unpack the genesis artifacts
        id: artifacts
        run: node scripts/ci/genesis-scaffold-inputs.mjs

      - name: Scaffold the tenant
        id: scaffold
        run: |
          set -o pipefail
          mkdir -p .tmp/genesis
          # A bash ARRAY, because `${VAR:+--flag "$VAR"}` word-splits AFTER expansion: a brand name
          # of "Acme Labs" arrives as two arguments and the niche becomes a stray positional. Every
          # value here is caller-supplied text, so each one is appended as its own element and the
          # artifact flags are read NUL-separated from the file the unpack step wrote.
          args=(--name "$GENESIS_SLUG")
          [ -n "$GENESIS_BRAND_NAME" ] && args+=(--brand-name "$GENESIS_BRAND_NAME")
          [ -n "$GENESIS_CANONICAL_HOST" ] && args+=(--canonical-host "$GENESIS_CANONICAL_HOST")
          [ -n "$GENESIS_NICHE" ] && args+=(--niche "$GENESIS_NICHE")
          if [ -s .tmp/genesis/artifact-args ]; then
            mapfile -t -d '' artifact_args < .tmp/genesis/artifact-args
            args+=("${artifact_args[@]}")
          fi
          args+=(--json)
          node packages/core/cli/create-site.mjs "${args[@]}" | tee .tmp/genesis/create-site-result.json

      # A new site is a new npm workspace: `npm install` (not `ci`) is what regenerates the root
      # lockfile to include it. Without this every subsequent `npm ci` in the fleet fails.
      - name: Regenerate the root lockfile
        run: npm install --no-audit --no-fund

      # A generated artifact whose freshness `npm test` gates. Omitting it turns the next run on main
      # red for everyone, which is how a previous scaffold cost two CI rounds.
      - name: Regenerate the inventory
        run: node scripts/docs/inventory.mjs --write

      - name: Enforce the scaffold charter
        run: node scripts/ci/genesis-scaffold-guard.mjs

      - name: Commit the new tenant
        id: commit
        run: |
          git config user.name "cms-agent genesis"
          git config user.email "genesis@kugelbrands.com"
          git add "sites/$GENESIS_SLUG" package-lock.json docs/generated/INVENTORY.md
          git commit -m "genesis: scaffold the $GENESIS_SLUG tenant [skip netlify]"
          # Another session's merge may have moved main while this job ran. Rebase and retry rather
          # than force: this job is never the authority on anything it did not write.
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && break
            else
              # A conflict stops the rebase MID-FLIGHT and leaves .git/rebase-merge behind; without
              # this abort every later attempt dies on "there is already a rebase-merge directory"
              # and the scaffold commit is lost. A lockfile conflict against a concurrent merge is
              # the likely case here, not the exotic one.
              git rebase --abort || true
            fi
            [ "$attempt" = 3 ] && { echo "Could not land the scaffold commit after 3 attempts." >&2; exit 1; }
            sleep $((attempt * 5))
          done
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The dispatcher pulls its result rather than this job pushing one: cms-agent is the only
      # party that writes cms-agent state, so the trust boundary stays one-directional.
      - name: Publish the result
        if: always()
        run: node scripts/ci/genesis-scaffold-report.mjs
        env:
          GENESIS_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          GENESIS_JOB_STATUS: ${{ job.status }}

      - name: Name the result blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The NAME is the payload — the dispatcher reads the blob sha off it and then reads the
          # blob, which is a JSON read rather than downloading and unzipping an archive.
          name: genesis-scaffold-result-blob-${{ env.GENESIS_REPORT_BLOB_SHA }}
          # The report lives under .tmp/, and v4 excludes dot-prefixed paths unless told otherwise —
          # with `if-no-files-found: error` that would fail a scaffold whose commit already landed.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .tmp/genesis/genesis-scaffold-result.v1.json
